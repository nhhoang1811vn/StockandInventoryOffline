  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/fonts/
    - assets/sounds/
    - assets/translations/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          style: normal
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
