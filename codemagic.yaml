  macos-release:
    name: macOS release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.7
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/*
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Generate cubit
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods
        script: find macos -name "Podfile" -execdir pod install \;
      - name: Build macOS app
        script: |
          flutter build macos --release -t lib/main.dart
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent *.app goodmanagerflutter-macos.zip
    artifacts:
      - build/macos/Build/Products/Release/*.app
      - build/macos/Build/Products/Release/*.zip
      - /tmp/xcodebuild_logs/*.log
