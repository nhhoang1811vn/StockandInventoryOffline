workflows:
  android-release:
    name: Android release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
      flutter: stable
      groups:
        - google_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/*
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Point Gradle at Android SDK 37.0
        script: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" "platforms;android-37.0" "ndk;28.2.13676358"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          ls -ld "$SDK_ROOT/platforms"/android-37*
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release -t lib/main.dart
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
